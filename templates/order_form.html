{% extends "base.html" %}
{% block content %}
<h2>{% if order %}编辑订单{% else %}新建订单{% endif %}</h2>
<form method="post">
    <div class="mb-3">
        <label class="form-label">关联客户</label>
        <select name="lead_id" class="form-select" required>
            <option value="">请选择客户</option>
            {% for lead in leads %}
            <option value="{{ lead.id }}" {% if order and order.lead_id == lead.id %}selected{% endif %}>
                {{ lead.name }}
            </option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">产品/服务</label>
        <input type="text" name="product" class="form-control" value="{{ order.product if order else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">金额</label>
        <input type="number" step="0.01" name="amount" class="form-control" value="{{ order.amount if order else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">订单状态</label>
        <select name="status" class="form-select">
            <option value="待确认">待确认</option>
            <option value="生产中">生产中</option>
            <option value="已发货">已发货</option>
            <option value="已完成">已完成</option>
            <option value="已取消">已取消</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">下单日期</label>
        <input type="date" name="order_date" class="form-control" value="{{ order.order_date.strftime('%Y-%m-%d') if order and order.order_date else '' }}">
    </div>
    <button type="submit" class="btn btn-primary">保存</button>
    <a href="/orders" class="btn btn-secondary">取消</a>
</form>
{% endblock %}
